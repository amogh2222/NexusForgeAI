[tool.poetry]
name = "nexusforge-ai-backend"
version = "2.0.0"
description = "NexusForge AI — Enterprise Autonomous AI Engineering Platform"
authors = ["NexusForge Team"]
packages = [
  {include = "backend"},
  {include = "agents"},
  {include = "rag"},
  {include = "sandbox"},
  {include = "graph"},
  {include = "intelligence"},
  {include = "evaluation"},
  {include = "plugins"},
]

# ════════════════════════════════════════════════════════════════════════════
# CORE dependencies — installs fast, required to run the backend
# Install with:  py -m poetry install --no-root
# ════════════════════════════════════════════════════════════════════════════
[tool.poetry.dependencies]
python = "^3.11"

# ─── Web Framework ──────────────────────────────────────────────────────────
fastapi            = "^0.115.0"
uvicorn            = {extras = ["standard"], version = "^0.32.0"}
python-multipart   = "^0.0.12"
websockets         = "^13.0"

# ─── Database ───────────────────────────────────────────────────────────────
sqlalchemy         = {extras = ["asyncio"], version = "^2.0.36"}
asyncpg            = "^0.30.0"
psycopg2-binary    = "^2.9.9"
alembic            = "^1.14.0"

# ─── Auth ───────────────────────────────────────────────────────────────────
python-jose        = {extras = ["cryptography"], version = "^3.3.0"}
passlib            = {extras = ["bcrypt"], version = "^1.7.4"}

# ─── Async / Background Tasks ────────────────────────────────────────────────
celery             = {extras = ["redis"], version = "^5.4.0"}
redis              = {extras = ["hiredis"], version = "^5.2.0"}
flower             = "^2.0.1"

# ─── AI / LLM ───────────────────────────────────────────────────────────────
langchain          = "^0.3.7"
langchain-community= "^0.3.7"
langchain-ollama   = "^0.2.1"
langchain-openai   = "^0.2.10"
langgraph          = "^0.2.56"
langgraph-checkpoint-postgres = "^2.0.9"
langchain-core     = "^0.3.0"

# ─── Vector DB (Qdrant) ─────────────────────────────────────────────────────
qdrant-client      = "^1.9.0"

# ─── Neo4j ──────────────────────────────────────────────────────────────────
neo4j              = "^5.18.0"

# ─── LLM Router ─────────────────────────────────────────────────────────────
litellm            = "^1.40.0"

# ─── Git Intelligence ────────────────────────────────────────────────────────
pydriller          = "^2.6"
gitpython          = "^3.1.43"

# ─── GitHub Integration ─────────────────────────────────────────────────────
pygithub           = "^2.5.0"
httpx              = "^0.28.0"

# ─── Code Analysis ──────────────────────────────────────────────────────────
tree-sitter            = "^0.23.2"
tree-sitter-python     = "^0.23.4"
tree-sitter-javascript = "^0.23.1"
tree-sitter-typescript = "^0.23.2"
tree-sitter-go         = "^0.23.4"

# ─── Observability ──────────────────────────────────────────────────────────
prometheus-fastapi-instrumentator = "^7.0.0"
opentelemetry-api                 = "^1.28.0"
opentelemetry-sdk                 = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
structlog                         = "^24.4.0"

# ─── Utilities ──────────────────────────────────────────────────────────────
pydantic           = {extras = ["email"], version = "^2.10.0"}
pydantic-settings  = "^2.6.1"
python-dotenv      = "^1.0.1"
aiofiles           = "^24.1.0"
tenacity           = "^9.0.0"
rich               = "^13.9.4"
chardet            = "^5.2.0"
langsmith          = "^0.1.0"


# ════════════════════════════════════════════════════════════════════════════
# ML group — heavy packages with torch (install separately AFTER core)
# Install with:  py -m poetry install --no-root --with ml
# ════════════════════════════════════════════════════════════════════════════
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
sentence-transformers = "^3.3.1"
torch                 = "^2.5.0"
# fastembed installs its own torch-cpu — let it manage
fastembed             = "^0.3.0"


# ════════════════════════════════════════════════════════════════════════════
# Eval group — RAGAS + HuggingFace datasets (install when doing evaluation)
# Install with:  py -m poetry install --no-root --with eval
# ════════════════════════════════════════════════════════════════════════════
[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
ragas    = "^0.2.0"
datasets = "^2.20.0"


# ════════════════════════════════════════════════════════════════════════════
# Dev group
# Install with:  py -m poetry install --no-root --with dev
# ════════════════════════════════════════════════════════════════════════════
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest           = "^8.3.3"
pytest-asyncio   = "^0.24.0"
pytest-cov       = "^6.0.0"
ruff             = "^0.8.0"
mypy             = "^1.13.0"


[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["backend/tests"]
